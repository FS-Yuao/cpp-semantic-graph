# 文档解析配置
# 被 cpp_semantic_graph/doc_graph/parser.py 和 cpp_semantic_graph/parser/ 共同使用

doc_dirs:
  - "docs/"

# 额外文档目录（绝对路径或相对于本配置文件所在目录）
# 这些目录的 .md 文件也会被 doc_graph parser 和 DocIngester 扫描入库
# 用途：将 CodeBuddy 自动生成的 .workbuddy/memory/ 纳入知识图谱
extra_doc_dirs:
  - "/mnt/code1/adc4.0/.workbuddy/memory"

# 统一排除规则 — gitignore 风格 glob 模式
# 所有文档解析器（doc_graph parser + cppsg doc parser）都读这个
exclude_patterns:
  # --- 通用排除 ---
  - "*.html"
  - "*.css"
  - "*.js"
  - "*/build/*"
  - "*/__pycache__/*"
  - "*/.git/*"
  - "*/.claude/*"
  - "*/cpp_semantic_graph_env/*"
  # --- 模板文件排除 ---
  # 文档模板不是真实文档，解析会产出 bogus 节点和边
  - "*/templates/*"
  - "_*.md"
  - "*_template.md"
  - "*_template_*.md"
  # --- 自动生成文件排除 ---
  - "*/doc_graph/doc_graph_data.json"
  - "*/doc_graph/doc_graph_viz.html"
  # --- 临时/草稿文件 ---
  - "*/tmp/*"
  - "*/draft/*"

# 按目录自动打标签（路径相对于 docs/ 根目录）
tag_rules:
  - path_pattern: "OTA_flow/**"
    tags: ["架构设计", "OTA"]
  - path_pattern: "AB_Switch/**"
    tags: ["架构设计", "A/B分区"]
  - path_pattern: "Doip_Uds/**"
    tags: ["接口规约", "UDS"]
  - path_pattern: "ADC4.0_System_architecture/**"
    tags: ["系统架构"]
  - path_pattern: "du_mcc/**"
    tags: ["DUCC", "MCC"]
  - path_pattern: "Claude_Code_Graph/**"
    tags: ["工具", "MCP"]
  - path_pattern: "Claude_harness/**"
    tags: ["工具", "Claude"]
  - path_pattern: "task/**"
    tags: ["开发任务"]
  - path_pattern: "review_reports/**"
    tags: ["审查报告"]
  - path_pattern: "Completion status/**"
    tags: ["完成报告"]

section_split:
  min_level: 2         # 按 ## 切片
  min_word_count: 20   # 少于 20 字的切片合并到上一节

# 手动精准关联（不侵入文档原文）
# 每条指定文档路径 + 关联的代码实体名，confidence=1.0
manual_links:
  - doc: "OTA_flow/OTA_COMPLETE_FLOW.md"
    heading: "刷写与激活"
    code:
      - "BasePeriUpdate"
      - "SocUpdate"
      - "PerformUpgrade"
      - "ExecuteDriveUpdate"

  - doc: "OTA_flow/OTA_COMPLETE_FLOW.md"
    heading: "完整性校验"
    code:
      - "VerifyVersionCompatibility"

  - doc: "OTA_flow/OTA_COMPLETE_FLOW.md"
    heading: "备份与持久化"
    code:
      - "SafeCopy"
      - "Rollback"

  - doc: "AB_Switch/AB_PARTITION_SWITCH_DESIGN.md"
    code:
      - "GetSocBootChain"

  - doc: "ADC4.0_System_architecture/ARCHITECTURE.md"
    code:
      - "OtaManager"
      - "BasePeriUpdate"
      - "OtaServiceInterfaceProxy"
